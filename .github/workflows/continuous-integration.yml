name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v6
      - name: Setup Bun
        if: steps.config.outputs.skip-platform != 'true'
        uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        if: steps.config.outputs.skip-platform != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Run Tests
        run: bun test
      - name: Run ESLint
        run: bun lint --fix=false
      - name: Run Prettier
        run: bun prettier --check .
